# 对于大多数项目，此工作流文件无需修改；您只需
# 将其提交到仓库即可。
#
# 您可以根据需要修改此文件，以覆盖要分析的语言集合，
# 或者提供自定义查询或构建逻辑。
#
# ******** 注意 ********
# 我们已经尝试检测您仓库中的语言。请检查下面定义的
# `language` 矩阵，确认是否包含正确的 CodeQL 支持语言集合。
#
name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '22 13 * * 1'

jobs:
  analyze:
    name: 分析
    # 运行器大小会影响 CodeQL 分析时间。了解更多信息，请参阅：
    #   - https://gh.io/recommended-hardware-resources-for-running-codeql
    #   - https://gh.io/supported-runners-and-hardware-resources
    #   - https://gh.io/using-larger-runners
    # 建议使用更大的运行器以缩短分析时间。
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    timeout-minutes: ${{ (matrix.language == 'swift' && 120) || 360 }}
    permissions:
      # 所有工作流都需要
      security-events: write

      # 仅私有仓库的工作流需要
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript-typescript' ]
        # CodeQL 支持的语言： [ 'c-cpp', 'csharp', 'go', 'java-kotlin', 'javascript-typescript', 'python', 'ruby', 'swift' ]
        # 仅使用 'java-kotlin' 可分析 Java、Kotlin 或两者混合的代码
        # 仅使用 'javascript-typescript' 可分析 JavaScript、TypeScript 或两者混合的代码
        # 了解更多 CodeQL 语言支持信息：https://aka.ms/codeql-docs/language-support

    steps:
    - name: 检出仓库
      uses: actions/checkout@v4

    # 初始化 CodeQL 扫描工具
    - name: 初始化 CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        # 如果需要指定自定义查询，可以在此处或配置文件中添加
        # 默认情况下，此处列出的查询会覆盖配置文件中的查询
        # 在列表前加 "+" 可同时使用此处查询和配置文件中的查询

        # 更多查询包信息请参考：https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-queries-in-ql-packs
        # queries: security-extended,security-and-quality


    # 自动构建尝试编译型语言（C/C++、C#、Go、Java 或 Swift）
    # 如果此步骤失败，请删除它并手动执行构建（见下方注释）
    - name: 自动构建
      uses: github/codeql-action/autobuild@v3

    # ℹ️ 使用系统 shell 执行的命令行程序
    # 📚 参考文档：https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idstepsrun

    #   如果上面的自动构建失败，请删除该步骤并取消下方注释
    #   根据项目实际情况修改或添加构建命令（参考示例）

    # - run: |
    #     echo "使用脚本运行并构建应用程序"
    #     ./location_of_script_within_repo/buildscript.sh

    - name: 执行 CodeQL 分析
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
